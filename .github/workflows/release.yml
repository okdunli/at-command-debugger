name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Same gates as CI - a tag release never ships an unbuildable tree.
  # Each runner packages its own platform-native format (dmg / zip /
  # AppImage + deb + rpm), the release job only collects and renames.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AT-Command-Debugger-windows-x64
            platform: windows-amd64
          # windows-11-arm runners are still experimental at GitHub; a failure
          # there must not sink the release.
          - os: windows-11-arm
            artifact: AT-Command-Debugger-windows-arm64
            platform: windows-arm64
            experimental: true
          - os: macos-15
            artifact: AT-Command-Debugger-macos-arm64
            platform: macos-arm64
          - os: macos-15-intel
            artifact: AT-Command-Debugger-macos-x64
            platform: macos-amd64
          - os: ubuntu-22.04
            artifact: AT-Command-Debugger-linux-x64
            platform: linux-amd64
          # The arm64 runners are still marked experimental by GitHub - a failure
          # there must not sink the whole release.
          - os: ubuntu-24.04-arm
            artifact: AT-Command-Debugger-linux-arm64
            platform: linux-arm64
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux webview + packaging tools)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1 \
            python3-dev libgirepository1.0-dev libcairo2-dev pkg-config \
            libfuse2 file ruby ruby-dev build-essential

      # pywebview's Windows backend is WebView2 (edgechromium); the hosted
      # windows runners do not ship the runtime, and the packaged app would
      # fail to open a window without it.
      - name: Install WebView2 runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # amd64 and arm64 runners need different installer builds
          if ([Environment]::Is64BitOperatingSystem -and [Environment]::ProcessorArchitecture -eq 'Arm64') {
            $url = 'https://go.microsoft.com/fwlink/p/?LinkId=2124704'
          } else {
            $url = 'https://go.microsoft.com/fwlink/p/?LinkId=2124703'
          }
          Write-Host "Installing WebView2 runtime from $url"
          Invoke-WebRequest -Uri $url -OutFile $env:RUNNER_TEMP\webview2.exe
          Start-Process -FilePath $env:RUNNER_TEMP\webview2.exe -ArgumentList '/silent','/install' -Wait

      - name: Install node dependencies
        run: npm ci

      - name: Type-check the .rose sources
        run: npm run check

      - name: Build the front-end
        run: npm run build

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyserial Pillow pyinstaller
      # pygobject is the GTK binding pywebview needs on Linux only - it needs a
      # GTK toolchain and does not install on Windows or macOS.
      - name: Install python dependencies (Linux webview bindings)
        if: runner.os == 'Linux'
        run: pip install "pygobject<3.51"

      # No version-bump commit is ever made: the number is derived from the
      # tag at build time. The bundled profile's app_version wins over
      # APP_VERSION when the UI renders it, so every place that carries a
      # number has to be stamped or the shipped bundle reports a stale one.
      - name: Stamp the version from the tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The release date is the tagged commit's own date, not the build
          # clock: re-tagging or rebuilding the same release keeps one date.
          DATE=$(git log -1 --format=%ad --date=short)
          sed -i.bak -E "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" atcdbg/__init__.py
          sed -i.bak -E "s/^APP_VERSION = \".*\"/APP_VERSION = \"$VERSION\"/" atcdbg/webui/backend.py
          rm -f atcdbg/__init__.py.bak atcdbg/webui/backend.py.bak
          for f in profiles/*/profile.json; do
            sed -i.bak -E "s/\"app_version\": \"[^\"]*\"/\"app_version\": \"$VERSION\"/" "$f"
            sed -i.bak -E "s/\"version\": \"[0-9]+\.[0-9]+\.[0-9]+\"/\"version\": \"$VERSION\"/" "$f"
            sed -i.bak -E "s/\"release_date\": \"[^\"]*\"/\"release_date\": \"$DATE\"/" "$f"
            rm -f "$f.bak"
          done
          echo "stamped version=$VERSION date=$DATE:"
          grep -H "__version__\|^APP_VERSION" atcdbg/__init__.py atcdbg/webui/backend.py
          grep -H '"app_version"\|^  "version"\|"release_date"' profiles/*/profile.json

      - name: Backend selftest
        run: python main.py --selftest
      - name: Pack the single-file executable
        run: python build.py

      # macOS: wrap the bare Mach-O into a real .app bundle (icon, Info.plist)
      # so Finder shows it as an application instead of a document.
      - name: Build the .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="AT指令调试台"
          EXE="dist/$APP"
          test -f "$EXE"
          mkdir -p "dist/$APP.app/Contents/MacOS" "dist/$APP.app/Contents/Resources"
          cp "$EXE" "dist/$APP.app/Contents/MacOS/$APP"
          chmod +x "dist/$APP.app/Contents/MacOS/$APP"
          VERSION="${GITHUB_REF_NAME#v}"
          cat > "dist/$APP.app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>$APP</string>
            <key>CFBundleIdentifier</key><string>com.atcommand.debugger</string>
            <key>CFBundleName</key><string>$APP</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          ICONSET=$(mktemp -d)/icon.iconset
          mkdir -p "$ICONSET"
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz assets/icon.png --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null
            sips -z $((sz*2)) $((sz*2)) assets/icon.png --out "$ICONSET/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "dist/$APP.app/Contents/Resources/icon.icns"
          # the app bundle replaces the loose binary in dist/
          rm -f "$EXE"

      - name: Package (platform-native)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="AT指令调试台"
          case "${{ matrix.platform }}" in
            windows-*)
              # portable zip: exe + editable profiles
              mkdir -p "pkg/$APP"
              exe=$(find dist -maxdepth 1 -name "*.exe" | head -1)
              cp "$exe" "pkg/$APP/$APP.exe"
              [ -d profiles ] && cp -R profiles "pkg/$APP/profiles"
              (cd pkg && 7z a -tzip "../${{ matrix.artifact }}.zip" "$APP" >/dev/null)
              # installer via Inno Setup (ISCC ships on the x64 windows images;
              # the arm64 image is newer and may lack it, so install on demand).
              # pkg/ must still exist here: it is the installer's source dir.
              case "${{ matrix.platform }}" in
                windows-amd64) IARCH=x64compatible ;;
                windows-arm64) IARCH=arm64 ;;
              esac
              if ! command -v ISCC >/dev/null 2>&1 && ! command -v iscc >/dev/null 2>&1; then
                choco install innosetup --yes --no-progress >/dev/null 2>&1 || true
              fi
              # Written line by line rather than as a heredoc: the paths hold
              # non-ASCII names, so the file needs a UTF-8 BOM to be read as
              # Unicode by Inno.
              printf '\xEF\xBB\xBF' > installer.iss
              {
                printf '%s\r\n' \
                  '[Setup]' \
                  "AppName=$APP" \
                  "AppVersion=$VERSION" \
                  'DefaultDirName={autopf}\ATCommandDebugger' \
                  'DefaultGroupName=ATCommandDebugger' \
                  'OutputDir=.' \
                  "OutputBaseFilename=${{ matrix.artifact }}-setup" \
                  'Compression=lzma2' \
                  'SolidCompression=yes' \
                  "ArchitecturesAllowed=$IARCH" \
                  "ArchitecturesInstallIn64BitMode=$IARCH" \
                  'UninstallDisplayIcon={app}\'"$APP"'.exe' \
                  '' \
                  '[Files]' \
                  'Source: "pkg\'"$APP"'\'"$APP"'.exe"; DestDir: "{app}"' \
                  'Source: "pkg\'"$APP"'\profiles\*"; DestDir: "{app}\profiles"; Flags: recursesubdirs' \
                  '' \
                  '[Icons]' \
                  'Name: "{group}\'"$APP"'"; Filename: "{app}\'"$APP"'.exe"'
              } >> installer.iss
              # ISCC.exe lives outside PATH on some images
              ISCC installer.iss || \
                "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss
              ls -la ${{ matrix.artifact }}-setup.exe
              rm -rf pkg
              ;;
            macos-*)
              # dmg with the .app bundle + editable profiles
              test -d "dist/$APP.app"
              mkdir -p dmgsrc
              cp -R "dist/$APP.app" "dmgsrc/$APP.app"
              [ -d profiles ] && cp -R profiles "dmgsrc/profiles"
              rm -f dmgsrc/profiles/config.json
              hdiutil create -volname "$APP" -srcfolder dmgsrc -ov -format UDZO \
                "${{ matrix.artifact }}.dmg"
              rm -rf dmgsrc
              ;;
          esac
          ls -la ${{ matrix.artifact }}.*

      - name: Package (Linux - AppImage + deb + rpm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="AT指令调试台"
          ARCH=amd64
          [ "${{ matrix.platform }}" = "linux-arm64" ] && ARCH=arm64
          DARCH=$ARCH; [ "$ARCH" = "amd64" ] && DARCH=amd64 || DARCH=arm64
          exe=$(find dist -maxdepth 1 -name "$APP" -type f | head -1)
          test -f "$exe"

          APPDIR=$(mktemp -d)/appdir
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          install -m 755 "$exe" "$APPDIR/usr/bin/$APP"
          # appimagetool derives .DirIcon from a PNG at the AppDir *top level*
          # whose name matches Icon= in the .desktop file - without it the
          # build aborts.
          cp assets/icon.png "$APPDIR/at-command-debugger.png"
          cp assets/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/at-command-debugger.png"
          cat > "$APPDIR/at-command-debugger.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=AT指令调试台
          Comment=AT command debugger
          Exec=$APP
          Icon=at-command-debugger
          Categories=Development;
          DESKTOP
          cp "$APPDIR/at-command-debugger.desktop" "$APPDIR/usr/share/applications/at-command-debugger.desktop"
          cat > "$APPDIR/AppRun" <<APPRUN
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/$APP" "\$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          # AppImage via appimagetool (prebuilt, runs on both runner arches)
          curl -sL -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$([ "$ARCH" = "amd64" ] && echo x86_64 || echo aarch64).AppImage"
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run "$APPDIR" \
            "${{ matrix.artifact }}.AppImage"

          # deb + rpm via fpm
          sudo gem install fpm --no-document >/dev/null 2>&1 || gem install fpm --no-document >/dev/null 2>&1 || true
          PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH" \
            fpm --package "${{ matrix.artifact }}.deb" -s dir -t deb \
              -n at-command-debugger -v "$VERSION" \
              --description "AT command debugger - rosezm front-end" \
              --license "Apache-2.0" --architecture "$DARCH" \
              -C "$APPDIR" usr
          PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH" \
            fpm --package "${{ matrix.artifact }}.rpm" -s dir -t rpm \
              -n at-command-debugger -v "$VERSION" \
              --description "AT command debugger - rosezm front-end" \
              --license "Apache-2.0" --architecture "$DARCH" \
              -C "$APPDIR" usr
          ls -la ${{ matrix.artifact }}.*

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # two patterns: the plain packages (name.zip / name.dmg) and the
          # Inno installer, which is name-setup.exe and so has no dot after
          # the artifact name.
          path: |
            ${{ matrix.artifact }}.*
            ${{ matrix.artifact }}-setup.exe
          if-no-files-found: error
          retention-days: 14

  # Notes from conventional commits since the previous tag, then the
  # platform packages attached to a pre-release.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the notes need every tag and the commits between them
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate release notes
        run: node tools/release-notes.mjs "$GITHUB_REF_NAME" > notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect packages
        shell: bash
        run: |
          # The per-runner jobs packaged platform-native formats named like
          # AT-Command-Debugger-windows-x64.zip; rename them into the
          # release naming scheme (version + platform, FlClash-style).
          shopt -s nullglob
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          for f in artifacts/*/*; do
            name=$(basename "$f")
            platform=""
            outname=""
            case "$name" in
              *-setup.exe)
                # Inno installer keeps its -setup marker in the release name;
                # the arch comes from the artifact it was built for.
                case "$name" in
                  *windows-x64*)   arch=amd64 ;;
                  *windows-arm64*) arch=arm64 ;;
                  *) echo "unknown installer arch: $name" >&2; continue ;;
                esac
                outname="AT-Command-Debugger-v${VERSION}-windows-${arch}-setup.exe" ;;
              *windows-x64.*) outname="AT-Command-Debugger-v${VERSION}-windows-amd64.${name##*.}" ;;
              *windows-arm64.*) outname="AT-Command-Debugger-v${VERSION}-windows-arm64.${name##*.}" ;;
              *macos-arm64.*) outname="AT-Command-Debugger-v${VERSION}-macos-arm64.${name##*.}" ;;
              *macos-x64.*) outname="AT-Command-Debugger-v${VERSION}-macos-amd64.${name##*.}" ;;
              *linux-x64.*) outname="AT-Command-Debugger-v${VERSION}-linux-amd64.${name##*.}" ;;
              *linux-arm64.*) outname="AT-Command-Debugger-v${VERSION}-linux-arm64.${name##*.}" ;;
              *) echo "skip unknown artifact: $name" >&2; continue ;;
            esac
            cp "$f" "release/$outname"
          done
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: release/*
          # every release ships as a pre-release (make_latest: false stops
          # softprops from flipping it to a full release afterwards)
          prerelease: true
          make_latest: false
